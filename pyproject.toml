[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "moodle-prairielearn-gateway"
version = "2.0.3"
description = "Verified Moodle LTI launches, persistent native assignments and scoped AGS results"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.143.0", "httpx==0.28.1", "joserfc==1.7.5", "python-multipart==0.0.32", "uvicorn==0.54.0", "pydantic==2.14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/moodle-prairielearn-gateway/schema" = ["schema/runtime.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
