# Фрагмент существующего HTTPS server, подключается только при явном включении.
# Замените существующий location /gateway/ либо перенесите в него директивы;
# не создавайте второй такой location. Сохраните regex handoff /gateway/.../pl/
# и остальные native PL locations из штатной конфигурации.
# В http-контексте заранее подключите проверенный Deployment-фрагмент
# deploy/exam-client-ip.nginx.conf с точным адресом доверенного Squid.
# Он определяет $exam_verified_client_ip; обычный браузерный XFF не является источником.
location /gateway/ {
    # Закрытый файл 0600 вне Git содержит ровно одну директиву:
    # proxy_set_header X-Exam-Proxy-Token "<тот же секрет, что в proxyTokenFile>";
    include /run/private/exam-proxy-token.conf;
    proxy_set_header X-Exam-Client-IP $exam_verified_client_ip;
    proxy_set_header X-Exam-Client-Cert-Id "";
    proxy_set_header X-Exam-Client-Cert-Proof "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Trust-Auth-Uid "";
    proxy_set_header X-Trust-Auth-Name "";
    proxy_set_header X-Trust-Auth-Name-UTF8-B64 "";
    proxy_set_header X-Trust-Auth-Uin "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://gateway:18080;
    access_log off;
}
