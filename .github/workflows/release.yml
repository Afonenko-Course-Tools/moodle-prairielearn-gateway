name: Публикация образа Gateway
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Существующий проверенный version tag (например v3.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gateway-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Проверить Git tag и версию пакета
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/validate-release.py
      - name: Проверить и собрать пакет
        run: |
          python -m pip install --no-deps -r requirements-dev.lock
          python -m pip install setuptools==82.0.1
          python -m pip check
          python -m pytest tests -q
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Определить имя образа
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Подтвердить отсутствие registry tag до публикации
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
        run: bash tools/require-absent-image.sh "$IMAGE"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Проверить загрузку опубликованного digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-release-${{ inputs.tag }}
          path: dist/
