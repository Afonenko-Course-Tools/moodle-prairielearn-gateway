name: Publish Gateway release image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gateway-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'v' + version:
              raise SystemExit('Tag must match the packaged version')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD') != git('rev-parse', tag + '^{commit}'):
              raise SystemExit('Checkout does not match the requested version tag')
          if subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main']).returncode:
              raise SystemExit('Release source is not integrated in main')
          PY
      - name: Require an unpublished release receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/gateway-release-assets
          if grep -Fxq release-images.json /tmp/gateway-release-assets; then
            echo 'This version already has a published image receipt; create a new version instead.' >&2
            exit 1
          fi
      - name: Test and package the release
        run: |
          python -m pip install --no-deps -r requirements-dev.lock
          python -m pip install setuptools==82.0.1
          python -m pip check
          python -m pytest tests -q
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Resolve image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'name=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Record published digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Missing actual registry image digest')
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected exactly one release wheel')
          receipt = {
              'schemaVersion': 1, 'versionTag': os.environ['RELEASE_TAG'],
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'repository': os.environ['RELEASE_REPOSITORY'], 'platform': 'linux/amd64',
              'image': os.environ['IMAGE_NAME'] + '@' + digest,
              'runtimeSchemaVersions': [1, 2],
              'wheel': {'name': wheels[0].name, 'sha256': hashlib.sha256(wheels[0].read_bytes()).hexdigest()},
              'deliveryMigration': 'changed delivery fails closed; explicit migration deferred'
          }
          pathlib.Path('dist/release-images.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-release-${{ inputs.tag }}
          path: dist/
      - name: Attach image receipt and wheel to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/release-images.json
